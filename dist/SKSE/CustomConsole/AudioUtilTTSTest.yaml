# ConsoleUtil Extended (CUE) command config for the AudioUtilTTS test harness.
# Requires: ConsoleUtil Extended  https://www.nexusmods.com/skyrimspecialedition/mods/133569
# Drops into Data\SKSE\CustomConsole\ ; maps console subcommands onto the
# global functions in AudioUtilTTSTest.psc. Each function's return value
# prints to the console.
#
# Usage in console:  AudioUtilTTSTest say "Some text"     (or the alias)  autts say "Some text"
version: 1
name: AudioUtilTTSTest
alias: autts
script: AudioUtilTTSTest
help: AudioUtilTTS console test harness (say, sayv, sayas, sayfrom, sayactor, sayactoras, event, eventas, sayevent, free, voice, dialogue, clearcache, status, stop, reload, enable)
subs:
  - name: say
    func: Say
    help: Speak a line with the configured voice
    args:
      - name: text
        type: String
        required: true
        help: The line to speak, in quotes
  - name: sayv
    func: SayVoice
    help: Speak a line with an explicit voice number of the default model
    args:
      - name: text
        type: String
        required: true
        help: The line to speak, in quotes
      - name: voice
        type: int
        default: 7
        help: Speaker number inside the model (see AudioUtilTTS.toml)
  - name: sayas
    func: SayAs
    help: Speak a line through a named preset from AudioUtilTTS.toml
    args:
      - name: text
        type: String
        required: true
        help: The line to speak, in quotes
      - name: preset
        type: String
        required: true
        help: Preset name, e.g. narrator, female, male, whisper
  - name: sayfrom
    func: SayFrom
    help: Speak a line naming the sender, which shows up in AudioUtilTTS.log
    args:
      - name: text
        type: String
        required: true
        help: The line to speak, in quotes
      - name: sender
        type: String
        default: console
        help: The sending mod's own short name
  - name: free
    func: Free
    help: Show whether a narration line and a character line would be taken right now
  - name: event
    func: ViaEvent
    help: Speak a line through the AudioUtilTTS_Speak mod event, the way other mods do
    args:
      - name: text
        type: String
        required: true
        help: The line to speak, in quotes
  - name: eventas
    func: ViaEventAs
    help: Speak a line through the mod event with a preset (AudioUtilTTS_Speak:<preset>)
    args:
      - name: text
        type: String
        required: true
        help: The line to speak, in quotes
      - name: preset
        type: String
        required: true
        help: Preset name, e.g. narrator, female, male, whisper
  - name: voice
    func: Voice
    help: Show which voice the console-selected actor (or the player) speaks with, by voice type
  - name: dialogue
    func: Dialogue
    help: Show the status of unvoiced-dialogue speech, or switch it for this session
    args:
      - name: on
        type: int
        default: -1
        help: 1 = on, 0 = off, leave out to only show the status
  - name: clearcache
    func: ClearCache
    help: Delete the cached dialogue lines so each is generated afresh
  - name: sayactor
    func: SayActor
    help: Make the console-selected actor (or the player) say a line, with lipsync
    args:
      - name: text
        type: String
        required: true
        help: The line to say, in quotes
  - name: sayactoras
    func: SayActorAs
    help: The same with a named preset instead of the speaker's own voice
    args:
      - name: text
        type: String
        required: true
        help: The line to say, in quotes
      - name: preset
        type: String
        required: true
        help: Preset name, e.g. narrator, female, male, whisper
  - name: sayevent
    func: SayEvent
    help: The same through the AudioUtilTTS_Say mod event, sent by that actor
    args:
      - name: text
        type: String
        required: true
        help: The line to say, in quotes
  - name: status
    func: Status
    help: Show whether speech is ready, and why not if it is not
  - name: stop
    func: Stop
    help: Drop waiting lines and stop the line being spoken
  - name: reload
    func: Reload
    help: Re-read AudioUtilTTS.toml and reload the models
  - name: enable
    func: Enable
    help: Switch speech on or off for this session
    args:
      - name: on
        type: int
        default: 1
        help: 1 = on, 0 = off
