# AudioUtilTTS - live text-to-speech for AudioUtil.
# A mod hands it a line of text; the line is spoken in game a moment later.
# Reload this file in game with:  autts reload

[general]
# Master switch. false also skips loading any model (the default one settles at
# about 625 MB of memory).
enable = true

[model]
# The default model: a folder under Data\SKSE\Plugins\AudioUtilTTS\models\.
# It is loaded at game start and never unloaded.
dir = "kokoro-en-v0_19"
# "auto" reads the folder: voices.bin present = Kokoro, otherwise VITS (Piper voices).
family = "auto"
# CPU threads used while a line is being generated. More threads = the line is
# ready sooner, but the game loses those cores for that moment. Measured on an
# i7-12700KF with the game closed, for a 4.5 second line:
#   1 thread 3.2 s    2 threads 1.9 s    4 threads 1.2 s
threads = 2
# Only for models that need them (multi-language Kokoro builds).
lexicon = ""
lang = ""
# Loading a model takes about 1 second; a line whose model is not in memory
# is delayed by that.
# How many models may be in memory at once, the default one included (1 to 32).
# A preset or a voice type can name another model; it is loaded the first time a
# line asks for it and kept. Past this limit the least recently used one is
# unloaded (never the default).
# RAM: a model takes memory only while it is loaded; an installed model that no
# line has asked for takes none. Measured per loaded model: a Kokoro model (the
# default one, or a fine-tuned voice of the same size) 450 to 500 MB after its
# first lines and about 625 MB once settled; a Piper voice about 350 MB. With
# Kokoro models this setting therefore allows up to about 0.6 GB times its
# value: 3 = 1.9 GB, 6 = 3.8 GB, 10 = 6.3 GB.
# With one model per voice type, raise this to the number of voices a busy
# scene mixes, or loading and unloading will delay lines.
max_loaded = 3

[voice]
# The default voice: what a line gets when it names no preset.
# Speaker number inside the default model. kokoro-en-v0_19:
#   0 af          1 af_bella     2 af_nicole    3 af_sarah    4 af_sky
#   5 am_adam     6 am_michael   7 bf_emma      8 bf_isabella 9 bm_george
#   10 bm_lewis
voice = 7
# 1.0 = the model's natural pace (0.5 to 2.0).
speed = 1.0
# 0.0 to 1.0, before AudioUtil's group volume is applied.
volume = 1.0

# Presets: named voices a mod asks for by name.
#   SendModEvent("AudioUtilTTS_Speak:whisper", "Not so loud.")
#   AudioUtilTTS.SpeakAs("Not so loud.", "whisper")
# Each [preset.<name>] may set model, voice, speed and volume; anything left out
# comes from [model] and [voice] above. A name nobody defined falls back to the
# default voice, so rename, change or add presets freely. Names ignore case.
#
# The four below all use the default model, so they cost no extra memory.

[preset.narrator]
voice = 7    # bf_emma

[preset.female]
voice = 1    # af_bella

[preset.male]
voice = 9    # bm_george

[preset.whisper]
voice = 2    # af_nicole

# A preset on another model. Put the model folder under models\ first; it is
# loaded on first use. With no "voice" it uses that model's first voice.
#
# [preset.fast]
# model = "vits-piper-en_US-lessac-medium"
# speed = 1.1

# Character speech: a line spoken by an actor, positioned at them, with their
# mouth moving (AudioUtilTTS.SpeakActor, or the actor sending AudioUtilTTS_Say).
# It has its own channel and its own placeholder files, so a character and the
# narrator can talk at the same time. Two characters do not: a line for one
# that arrives while another speaks is dropped (see [playback] max_pending).
[speech]
# AudioUtil volume group and exclusivity channel. The channel must differ from
# the [playback] one.
group = "speech"
channel = "speech"
# Move the speaker's mouth (AudioUtil lipsync, driven by loudness). Needs
# AudioUtil 0.9.26 or newer; with an older one the mouth stays still.
lipsync = true
# Placeholder wav files for character lines (Data\Sound\AudioUtilTTS).
slots = 4
# With no preset named, a character uses the voice of their voice type when one
# is set up (see [voicetype] below), else the preset "female" or "male" by
# their sex when those exist above, else the default voice.

# Game dialogue that has no recorded voice. When the game is about to say a
# dialogue line and no voice file exists for it, the line is generated in the
# voice of the speaker's voice type and the game plays it like a recorded one:
# its timing, subtitles, voice volume slider and lipsync all apply. A line with
# a recorded voice is never touched. Works beside Fuz Ro D'oh, which keeps
# covering the lines this plugin leaves alone.
[dialogue]
# false = the game is not patched at all. A change here needs a game restart;
# "autts dialogue 0" switches it off for the session.
enable = true
# A line said before comes from a cache on disk. A new one has to be generated
# first, and the game is never made to wait for that:
#  - Lines in the dialogue menu are prepared in the background while the menu
#    is up, the first line of each topic first. A new line is voiced this time
#    only if it should be generated within about 2.5 seconds, the time a player
#    takes to pick a topic; otherwise it is left unvoiced this once and voiced
#    from the next time on.
#  - A line said right away (a scene, a greeting, a remark in passing) cannot
#    be prepared: a new one stays unvoiced this once and is voiced from the
#    next time on. Later lines of the same topic are generated while the
#    earlier ones play. For greetings see prepare_greetings below.
# A line with nothing to say (a stage direction, or a placeholder such as "...")
# is left alone.
# false = a voice type with no voice of its own (see [voicetype]) stays
#         unvoiced, so only the voice types you set up are spoken.
# true  = such a voice type is spoken with the preset "female" or "male" by
#         its sex.
fallback = false
# Make greetings ahead of time. A greeting is said the moment the game decides
# on it, so a new one cannot be generated in time and stays unvoiced the first
# time. With this on, the plugin looks at the NPCs near you (about 20 m, one
# every 2 seconds), works out which greetings each would say right now, and
# generates the unvoiced ones in the background, behind every line the game
# actually asked for. When the NPC then greets you, the line is ready.
# The cost: up to 3 lines of CPU work for every NPC you come near whose voice
# type has a voice, whether or not they ever greet you. Only NPCs whose lines
# would be spoken anyway are looked at, and nothing happens while the game is
# paused, in a menu or in combat. Can be switched with "autts reload".
prepare_greetings = false
# Move the speaker's mouth. The mouth shapes are guessed from the loudness of
# the line, as the speech model gives no timing: it reads as talking, it does
# not form the actual sounds.
lipsync = true
# How far the mouth opens, 0.0 to 1.5.
lip_strength = 0.8
# Leave out stage directions: text in (parentheses), [brackets] or *asterisks*.
skip_directions = true
# Placeholder voice files (Data\Sound\Voice\AudioUtilTTS), 64 to 256. A line in
# the dialogue menu holds one from the moment the menu lists it, and the plugin
# cannot see when the game is done with it: a placeholder goes to the line used
# longest ago, and never to one used in the last half minute. A line that finds
# none free stays unvoiced. A slot added by raising this number starts working
# after the next restart.
slots = 128
# Size limit of the cache of generated lines (Data\SKSE\Plugins\AudioUtilTTS\
# cache), in MB. The lines used longest ago are dropped first. 0 = no limit.
# A line is cached per model file, so a retrained model starts afresh by itself
# after "autts reload".
cache_max_mb = 256

# Voice types: which voice speaks for which of the game's voice types. This is
# what makes an NPC's generated lines sound like that NPC. Used for unvoiced
# dialogue, and for character speech that names no preset.
#
# A voice type finds its voice in this order:
#   1. its line below:  <voice type ID> = "<preset name>"
#   2. a preset named exactly like the voice type, e.g. [preset.MaleNord]
#   3. a model folder named exactly like the voice type, models\MaleNord
#      (its first voice), with no line here at all
#   4. the preset "female" or "male" by sex, only when [dialogue] fallback is on
# The ID is the voice type's editor ID as xEdit shows it; case is ignored.
# "autts voice" in the console shows which voice the selected actor gets.
# An empty preset name means that voice type is never spoken for.
[voicetype]
# MaleNord = "malenord"
# FemaleEvenToned = "eventoned"
# FemaleYoungEager = "eventoned"     # several voice types can share one voice
# CrDogVoice = ""                    # never spoken for
#
# The presets those lines name, for a model with one voice per folder and for
# one model that holds many voices:
#
# [preset.malenord]
# model = "nord-male"
#
# [preset.eventoned]
# model = "my-voices"
# voice = 4

# Narration: lines with no speaker (AudioUtilTTS.Speak, AudioUtilTTS_Speak).
[playback]
# AudioUtil volume group and exclusivity channel the narration plays on.
group = "narration"
channel = "narration"
# false = a new line waits for the one being spoken to finish.
# true  = a new line cuts in as soon as it is ready.
interrupt = false
# Lines allowed to wait behind the one being generated.
# 0 = none, one line at a time: a line that arrives while another is waiting,
#     being generated or being spoken is dropped. A mod that sends lines faster
#     than they can be spoken is then not read out back to back. With interrupt
#     on, a line being spoken does not count, the new one cuts into it.
# 1 or more = that many wait and follow each other without a pause. When more
#     arrive, the oldest waiting line is dropped.
# Applies to narration and to character speech, each counted on its own. Every
# dropped line is noted in AudioUtilTTS.log with the reason.
max_pending = 0
# Longer text is cut at the last sentence that fits.
max_chars = 400
# Placeholder wav files the speech is written into (Data\Sound\AudioUtilTTS).
# The game only plays files it saw at launch, so a slot added by raising this
# number starts working after the next restart.
slots = 4
# 0 = write the model's own sample rate (24000 for Kokoro). Set 44100 if speech
# plays at the wrong pitch or speed.
output_rate = 0
