# AudioUtilTTS - live text-to-speech for AudioUtil.
# A mod hands it a line of text; the line is spoken in game a moment later.
# Reload this file in game with:  autts reload

[general]
# Master switch. false also skips loading any model (the default one settles at
# about 625 MB of memory).
enable = true
# Fill-in voices: a voice archive can offer voices for the voice types that
# nothing else gives a voice (fill_in = true in its model.toml or voice type
# patch). They rank below every other way a voice type finds its voice, a voice
# archive named after the voice type included, so a voice you install for a
# voice type later takes over by itself. false = fill-in voices are not used.
fill_in_voices = true

[model]
# The default model: a folder under Data\SKSE\Plugins\AudioUtilTTS\models\.
# It is loaded at game start and never unloaded.
# It is optional. Without it, lines that name no other model stay silent
# (narration, the presets below, the voices by sex), and a voice with a model
# of its own, such as a model folder named like a voice type, speaks as usual.
dir = "kokoro-en-v0_19"
# "auto" reads the folder: lm_main*.onnx present = Pocket, voices.bin present =
# Kokoro, otherwise VITS (Piper voices). Or "kokoro", "vits", "pocket".
family = "auto"
# CPU threads used while a line is being generated. More threads = the line is
# ready sooner, but the game loses those cores for that moment. Measured on an
# i7-12700KF with the game closed, for a 4.5 second line:
#   1 thread 3.2 s    2 threads 1.9 s    4 threads 1.2 s
threads = 2
# Only for models that need them (multi-language Kokoro builds).
lexicon = ""
lang = ""
# Loading a model takes about 1 second; a line whose model is not in memory
# is delayed by that.
# How many models may be in memory at once, the default one included (1 to 32).
# A preset or a voice type can name another model; it is loaded the first time a
# line asks for it and kept. Past this limit the least recently used one is
# unloaded (never the default).
# RAM: a model takes memory only while it is loaded; an installed model that no
# line has asked for takes none. Measured per loaded model: a Kokoro model (the
# default one, or a fine-tuned voice of the same size) 450 to 500 MB after its
# first lines and about 625 MB once settled; a Piper voice about 350 MB. With
# Kokoro models this setting therefore allows up to about 0.6 GB times its
# value: 4 = 2.5 GB, 6 = 3.8 GB, 10 = 6.3 GB.
# With one model per voice type, raise this to the number of voices a busy
# scene mixes, or loading and unloading will delay lines.
max_loaded = 4
# Models never unloaded to make room, by folder name, comma separated. For a
# model that many voices share, such as a Pocket model, which would otherwise
# be unloaded and loaded again (about a second) whenever other voices crowd it
# out. They count against max_loaded; the default model never needs listing.
keep_loaded = "pocket-tts"

[voice]
# The default voice: what a line gets when it names no preset.
# Speaker number inside the default model. kokoro-en-v0_19:
#   0 af          1 af_bella     2 af_nicole    3 af_sarah    4 af_sky
#   5 am_adam     6 am_michael   7 bf_emma      8 bf_isabella 9 bm_george
#   10 bm_lewis
# For a Pocket model, the name of one of its recordings in quotes: "gruff" for
# models\<dir>\voices\gruff.wav.
voice = 7
# 1.0 = the model's natural pace (0.5 to 2.0).
speed = 1.0
# 0.0 to 1.0, before AudioUtil's group volume is applied.
volume = 1.0

# Presets: named voices a mod asks for by name.
#   SendModEvent("AudioUtilTTS_Speak:whisper:MyMod", "Not so loud.")
#   AudioUtilTTS.SpeakFrom("MyMod", "Not so loud.", "whisper")
# Each [preset.<name>] may set model, voice, speed and volume; anything left out
# comes from [model] and [voice] above. A name nobody defined falls back to the
# default voice, so rename, change or add presets freely. Names ignore case.
#
# A mod can bring presets of its own as a file: every presets\*.toml beside
# this file is read too, holding the same [preset.<name>] tables. A preset
# defined here wins over one of the same name from such a file, and it is taken
# whole: to change a mod's preset, copy all of it here under the same name and
# edit it. A preset from such a file is for lines that ask for it by name; it
# does not speak for a voice type by being named like one.
#
# The four below all use the default model, so they cost no extra memory.

[preset.narrator]
voice = 7    # bf_emma

[preset.female]
voice = 1    # af_bella

[preset.male]
voice = 9    # bm_george

[preset.whisper]
voice = 2    # af_nicole

# A preset on another model. Put the model folder under models\ first; it is
# loaded on first use. With no "voice" it uses that model's first voice.
#
# [preset.fast]
# model = "vits-piper-en_US-lessac-medium"
# speed = 1.1
#
# On a Pocket model a voice is one of the model's recordings, named by its
# file name without ".wav" (speed does not apply to those):
#
# [preset.gruff]
# model = "pocket-tts"
# voice = "gruff"        # models\pocket-tts\voices\gruff.wav

# Character speech: a line spoken by an actor, positioned at them, with their
# mouth moving (AudioUtilTTS.SpeakActorFrom, or the actor sending
# AudioUtilTTS_Say).
# It has its own channel and its own placeholder files, so a character and the
# narrator can talk at the same time. Two characters do not: a line for one
# that arrives while another speaks is dropped (see [playback] max_pending).
[speech]
# AudioUtil volume group and exclusivity channel. The channel must differ from
# the [playback] one.
group = "speech"
channel = "speech"
# Move the speaker's mouth (AudioUtil lipsync, driven by loudness). Needs
# AudioUtil 0.9.26 or newer; with an older one the mouth stays still.
lipsync = true
# Placeholder wav files for character lines (Data\Sound\AudioUtilTTS).
slots = 4
# With no preset named, a character uses the voice of their voice type when one
# is set up (see [voicetype] below), else the preset "female" or "male" by
# their sex when those exist above, else the default voice.

# Game dialogue that has no recorded voice. When the game is about to say a
# dialogue line and no voice file exists for it, the line is generated in the
# voice of the speaker's voice type and the game plays it like a recorded one:
# its timing, subtitles, voice volume slider and lipsync all apply. A line with
# a recorded voice is never touched. Works beside Fuz Ro D'oh, which keeps
# covering the lines this plugin leaves alone.
[dialogue]
# false = the game is not patched at all. A change here needs a game restart;
# "autts dialogue 0" switches it off for the session.
enable = true
# A line said before comes from a cache on disk. A new one has to be generated
# first, and the game is never made to wait for that:
#  - Lines in the dialogue menu are prepared in the background while the menu
#    is up, the first line of each topic first. A new line is voiced this time
#    only if it should be generated within about 2.5 seconds, the time a player
#    takes to pick a topic; otherwise it is left unvoiced this once and voiced
#    from the next time on.
#  - A line said right away (a scene, a greeting, a remark in passing) cannot
#    be prepared: a new one stays unvoiced this once and is voiced from the
#    next time on. Later lines of the same topic are generated while the
#    earlier ones play. Greetings are the exception, see "greetings" below.
# A line with nothing to say (a stage direction, or a placeholder such as "...")
# is left alone.
# false = a voice type with no voice of its own (see [voicetype]) stays
#         unvoiced, so only the voice types you set up are spoken.
# true  = such a voice type is spoken with the preset "female" or "male" by
#         its sex.
fallback = false
# Speak a new greeting late instead of not at all. A greeting is said the moment
# the game decides on it, so a new one cannot be generated in time. With this
# on, it is generated right then and spoken as soon as it is ready: about as
# late as a line takes to generate. It then plays as character speech (the
# [speech] group and channel, at the NPC, mouth moving), not through the game's
# dialogue, so its subtitle has been shown already. From the second time on the
# line comes from the cache and the game says it on time itself.
# Not only greetings: every line of one response that is said right away, such
# as the line that opens a conversation or a remark in passing. Such a line is
# generated before every other dialogue line that waits, and it is still spoken
# once the conversation it opened has started. Not spoken when it has further
# responses behind it, when it would be later than greetings_max_late, when
# the speaker is gone, when the speaker has gone on to another line, or when
# another character line is being spoken.
# Can be switched with "autts reload".
greetings = true
# The longest a line may be late and still be spoken, in seconds (0.5 to 10).
# A line that is not ready by then stays unvoiced this once and is spoken on
# time from the next time on. The wait is the time the line takes to generate,
# plus about a second when its voice has to be loaded first.
# Can be changed with "autts reload".
greetings_max_late = 4.0
# Speak a long line that is late in two parts, so that it is heard sooner: its
# first sentence as soon as that is generated, and the rest right behind it,
# generated while the first sentence is being said. Only this first time: the
# cache gets the whole line, which the game says in one piece from then on.
# A line of one sentence is not split.
# Can be switched with "autts reload".
greetings_split = true
# Make greetings ahead of time, so that a new one is on time. A greeting is
# said the moment the game decides on it, so a new one cannot be generated in
# time. With this on, the plugin looks at the NPCs near you (about 20 m, one
# every 2 seconds), works out which greetings each would say right now, and
# generates the unvoiced ones in the background, behind every line the game
# actually asked for. When the NPC then greets you, the line is ready.
# WARNING: this is heavy, most of all in towns. Up to 3 lines are generated
# for every NPC you come near whose voice type has a voice, whether or not
# they ever greet you, and each one is a full line's work for the speech
# threads ([model] threads). The voice of each such NPC is loaded into memory
# for it: among more voices than [model] max_loaded allows, voices are loaded
# and dropped over and over. It eases off as the cache fills, since a line is
# made once. Leave it off when the game is short of CPU or memory.
# Only NPCs whose lines would be spoken anyway are looked at, and nothing
# happens while the game is paused, in a menu or in combat. Can be switched
# with "autts reload".
prepare_greetings = false
# Move the speaker's mouth. The mouth shapes are guessed from the loudness of
# the line, as the speech model gives no timing: it reads as talking, it does
# not form the actual sounds.
lipsync = true
# How far the mouth opens, 0.0 to 1.5.
lip_strength = 0.8
# Leave out stage directions: text in (parentheses), [brackets] or *asterisks*.
skip_directions = true
# Placeholder voice files (Data\Sound\Voice\AudioUtilTTS), 64 to 256. A line in
# the dialogue menu holds one from the moment the menu lists it, and the plugin
# cannot see when the game is done with it: a placeholder goes to the line used
# longest ago, and never to one used in the last half minute. A line that finds
# none free stays unvoiced. A slot added by raising this number starts working
# after the next restart.
slots = 128
# Size limit of the cache of generated lines (Data\SKSE\Plugins\AudioUtilTTS\
# cache), in MB. The lines used longest ago are dropped first. 0 = no limit.
# A line is cached per model file, so a retrained model starts afresh by itself
# after "autts reload".
cache_max_mb = 1024

# Voice types: which voice speaks for which of the game's voice types. This is
# what makes an NPC's generated lines sound like that NPC. Used for unvoiced
# dialogue, and for character speech that names no preset.
#
# A voice type finds its voice in this order:
#   1. its line below:  <voice type ID> = "<preset name>"
#   2. a preset of this file named exactly like the voice type, e.g.
#      [preset.MaleNord]
#   3. a voice type patch that names an installed model (see below)
#   4. a model that lists the voice type in its own model.toml (see below)
#   5. a model folder named exactly like the voice type, models\MaleNord
#      (its first voice), with no line here at all
#   6. a fill-in voice (see below), unless [general] fill_in_voices is off
#   7. the preset "female" or "male" by sex, only when [dialogue] fallback is on
# The ID is the voice type's editor ID as xEdit shows it; case is ignored.
# "autts voice" in the console shows which voice the selected actor gets.
# An empty preset name means that voice type is never spoken for.
# A preset whose model is not installed is passed over in steps 1 and 2.
#
# A patch gives voice types to voices that are already installed, from a file of
# its own: every voicetypes\*.toml beside this file is read, in file name order,
#   [voicetype]
#   HjoromirVoice = "MaleYoungEager"     # voice type ID = the model folder
#   RumarinVoice = { model = "my-voices", voice = 3 }   # speed, volume too
#   OrcVoice = { model = "pocket-tts", voice = "gruff" }   # a recording by name
# Several patches add up, and an entry whose voice is not installed is skipped.
#
# A model can bring its own list, so that installing the model is all it takes:
# a file models\<folder>\model.toml inside the model's folder,
#   [voicetype]
#   MaleNord = 0             # voice type ID = voice number inside that model
#   MaleNordCommander = 0
#   MaleOrc = "gruff"        # or, on a Pocket model, a recording by name
#   [voice]                  # optional, for every voice type the file lists
#   speed = 1.0
#   volume = 1.0
# Lines 1 and 2 here win over it, so a model's choice can always be overruled
# or silenced from this file. When two models list the same voice type, the
# one later in folder name order is used and the log says so.
#
# Fill-in voices: a patch or a model.toml that starts with
#   fill_in = true
# offers its voices only for the voice types nothing else gives a voice (step
# 6): a set of stand-in voices for the voice types you have no trained voice
# for, which a voice you install later takes over from by itself. A voice meant
# for a voice type beats a fill-in whatever the file order. [general]
# fill_in_voices = false switches them all off.
[voicetype]
# MaleNord = "malenord"
# FemaleEvenToned = "eventoned"
# FemaleYoungEager = "eventoned"     # several voice types can share one voice
# CrDogVoice = ""                    # never spoken for
#
# The presets those lines name, for a model with one voice per folder and for
# one model that holds many voices:
#
# [preset.malenord]
# model = "nord-male"
#
# [preset.eventoned]
# model = "my-voices"
# voice = 4

# Narration: lines with no speaker (AudioUtilTTS.SpeakFrom, AudioUtilTTS_Speak).
[playback]
# AudioUtil volume group and exclusivity channel the narration plays on.
group = "narration"
channel = "narration"
# false = a new line waits for the one being spoken to finish.
# true  = a new line cuts in as soon as it is ready.
interrupt = false
# Lines allowed to wait behind the one being generated.
# 0 = none, one line at a time: a line that arrives while another is being
#     generated or spoken is dropped. A mod that sends lines faster than they
#     can be spoken is then not read out back to back. With interrupt on, a
#     line being spoken does not count, the new one cuts into it. A line not
#     started on yet (the plugin is busy with a character line or dialogue) is
#     replaced by a newer one.
#     A line that was cut short (AudioUtil's StopHandle, StopChannel, StopGroup)
#     frees its lane at once with AudioUtil 0.9.28 or newer; with an older one
#     the lane stays busy until that line would have ended.
# 1 or more = that many wait and follow each other without a pause. When more
#     arrive, the oldest waiting line is dropped.
# Applies to narration and to character speech, each counted on its own. Every
# dropped line is noted in AudioUtilTTS.log with the reason.
max_pending = 0
# Longer text is cut at the last sentence that fits.
max_chars = 400
# Placeholder wav files the speech is written into (Data\Sound\AudioUtilTTS).
# The game only plays files it saw at launch, so a slot added by raising this
# number starts working after the next restart.
slots = 4
# 0 = write the model's own sample rate (24000 for Kokoro). Set 44100 if speech
# plays at the wrong pitch or speed.
output_rate = 0
