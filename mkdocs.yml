site_name: AudioUtilTTS
site_description: Live text-to-speech for Skyrim SE. Speaks any line a mod hands it, and game dialogue that has no recorded voice.
site_url: https://crajjjj.github.io/AudioUtilTTS/
repo_name: crajjjj/AudioUtilTTS
repo_url: https://github.com/crajjjj/AudioUtilTTS
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - For Players:
    - Getting Started: players/getting-started.md
    - What to Expect: players/what-to-expect.md
    - Unvoiced Dialogue: players/unvoiced-dialogue.md
    - Your Own Lines: players/player-lines.md
    - SkyrimNet: players/skyrimnet.md
    - Voices, Presets & Voice Types: players/voices.md
    - Voice Models: players/models.md
    - A Voice from a Recording: players/voice-from-recording.md
    - In-Game Menu: players/settings-menu.md
    - Configuration Reference: players/configuration.md
    - Console Commands: players/console-commands.md
    - Troubleshooting & Logs: players/troubleshooting.md
  - For Mod Authors:
    - Overview: authors/overview.md
    - Mod Events: authors/modevents.md
    - Papyrus API: authors/papyrus-api.md
    - C++ API: authors/cpp-api.md
    - Training a Voice: authors/training-voices.md
    - Shipping a Voice Model: authors/voice-models.md
    - How It Works: authors/how-it-works.md
    - Tools: authors/tools.md
    - Building from Source: authors/building.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  links:
    not_found: warn
    anchors: warn

plugins:
  - search
